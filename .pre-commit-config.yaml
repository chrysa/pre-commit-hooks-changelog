default_language_version:
  python: python3.14
fail_fast: false
minimum_pre_commit_version: 4.1.0
repos:
- repo: https://github.com/chrysa/pre-commit-hooks-changelog
  rev: v0.1.3
  hooks:
  - id: generate-changelog
- repo: https://github.com/chrysa/pre-commit-tools
  rev: v0.2.0-253
  hooks:
  - id: format-dockerfiles
  - id: python-print-detection
    exclude: (^|/)tests?/|^(README\.md|docs/)|(^|/)quality_gate\.py$|^\.claude/ape/
  - id: python-pprint-detection
    exclude: (^|/)tests?/|^(README\.md|docs/)|(^|/)quality_gate\.py$|^\.claude/ape/
  - id: debugger-detection
    exclude: (^|/)tests?/|^(README\.md|docs/)
  - id: python-logger-detection
    exclude: (^|/)tests?/|^(README\.md|docs/)
  - id: json-sorter
  - id: requirements-sort
  - id: env-file-check
  - id: yaml-sorter
    exclude: ^(\.github/|workflows/|templates/|docker-compose)|(^|/)(pnpm-lock|yarn|uv|poetry)\.(yaml|lock)$|(^|/)\.pre-commit-config\.yaml$
  - id: makefile-check
  - id: env-example-sync
  - id: adr-gate
  - id: claude-skill-frontmatter
  - id: claude-agent-frontmatter
  - id: claude-mcp-config
  - id: no-bare-except
  - id: python-unreachable-code
  - id: python-no-unittest-import
  - id: python-untyped-raise
    exclude: (^|/)tests?/
  - id: python-mutable-default
  - id: python-dispatch-ladder
  - id: claude-assets-present
  - id: no-hardcoded-localhost
    exclude: tests?/|\.test\.|\.spec\.
  - id: regression-gate
    stages:
    - pre-push
  - id: dockerfile-no-latest
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.3
  hooks:
  - id: ruff
    args:
    - --fix
  - id: ruff-format
- repo: https://github.com/asottile/setup-cfg-fmt
  rev: v3.2.0
  hooks:
  - id: setup-cfg-fmt
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.3.1
  hooks:
  - id: mypy
    additional_dependencies:
    - ruamel.yaml
- repo: https://github.com/IamTheFij/docker-pre-commit
  rev: v3.0.1
  hooks:
  - id: docker-compose-check
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.1
  hooks:
  - id: markdownlint
    args:
    - --fix
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
    args:
    - --unsafe
  - id: check-toml
  - id: check-merge-conflict
  - id: check-added-large-files
  - id: mixed-line-ending
    args:
    - --fix=lf
  - id: check-json
  - id: detect-private-key
  - args:
    - --branch
    - main
    id: no-commit-to-branch
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
  hooks:
  - id: conventional-pre-commit
    stages:
    - commit-msg
    args:
    - feat
    - fix
    - docs
    - style
    - refactor
    - test
    - chore
    - perf
    - revert
    - ci
- repo: https://github.com/chrysa/guideline-checker
  rev: v1.31.0-14
  hooks:
  - id: guideline-check
    args:
    - check
    - --fail-on
    - error
    - --baseline
    - .guideline-baseline.json
exclude: (^|/)quality_gate\.py$|^\.claude/ape/
