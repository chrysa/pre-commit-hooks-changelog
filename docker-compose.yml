services:
  documentation:
    build:
      cache_from:
      - generate_changelog_documentation:1.0.0
      - python:3.8-alpine
      context: .
      dockerfile: Dockerfile
      target: documentation
    command: bash
    container_name: documentation_generate_changelog
    image: generate_changelog_documentation:1.0.0
    volumes:
    - ./docs:/src/docs
    - ./pre_commit_hook:/src/pre_commit_hook
    working_dir: /src
  generate_changelog:
    build:
      cache_from:
      - generate_changelog:0.2.0
      - python:3.8-alpine
      context: .
      dockerfile: Dockerfile
      target: application
    command: bash
    container_name: generate_changelog
    image: generate_changelog:0.2.0
    volumes:
    - ./changelog:/src/changelog
    - ./pre_commit_hook:/src/pre_commit_hook
    working_dir: /src
  pytest:
    build:
      cache_from:
      - generate_changelog_pytest:1.0.0
      - python:3.8-alpine
      context: .
      dockerfile: Dockerfile
      target: pytest
    command: bash
    container_name: pytest_generate_changelog
    image: generate_changelog_pytest:1.0.0
    volumes:
    - ./pre_commit_hook:/src/pre_commit_hook
    - ./tests:/src/tests
    working_dir: /src
  quality:
    build:
      cache_from:
      - generate_changelog_quality:1.0.0
      - python:3.8-alpine
      context: .
      dockerfile: Dockerfile
      target: pytest
    command: bash
    container_name: quality_generate_changelog
    image: generate_changelog_quality:1.0.0
    volumes:
    - ./pre_commit_hook:/src/pre_commit_hook
    working_dir: /src
x-app:
  build:
    cache_from:
    - python:3.8-alpine
    context: .
    dockerfile: Dockerfile
  command: bash
  volumes:
  - ./pre_commit_hook:/src/pre_commit_hook
  working_dir: /src
